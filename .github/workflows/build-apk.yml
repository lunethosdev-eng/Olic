name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Install JS dependencies
        run: npm install --legacy-peer-deps

      - name: Expo prebuild
        run: npx expo prebuild --platform android --no-install --non-interactive

      - name: Force New Architecture (Reanimated 4)
        run: |
          PROP=android/gradle.properties
          if [ -f "$PROP" ]; then
            sed -i 's/newArchEnabled=false/newArchEnabled=true/g' "$PROP" || true
            grep -q 'newArchEnabled=' "$PROP" || echo 'newArchEnabled=true' >> "$PROP"
            sed -i 's/hermesEnabled=false/hermesEnabled=true/g' "$PROP" || true
            grep -q 'hermesEnabled=' "$PROP" || echo 'hermesEnabled=true' >> "$PROP"
            echo "--- gradle.properties ---"
            cat "$PROP"
          else
            echo "gradle.properties missing after prebuild"
            exit 1
          fi

      - name: Build Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pokke-apk
          path: android/app/build/outputs/apk/release/**/*.apk
          if-no-files-found: warn
          retention-days: 14
